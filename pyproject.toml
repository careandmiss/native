[project]
name = "mcp-ppt-native-fill"
version = "0.1.0"
description = "Stdlib-only MCP server wrapping ppt-master v6.3.0 Edit Native PPTX native fill pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "native_fill MCP maintainers"}
]
keywords = ["mcp", "pptx", "ppt-master", "native-fill"]
dependencies = []  # stdlib-only

[project.scripts]
mcp-ppt-native-fill = "mcp_ppt_native_fill.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ppt_native_fill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
